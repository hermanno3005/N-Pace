# On the Pi: put INTERVALS_API_KEY / INTERVALS_ATHLETE_ID in .env next to this file,
# then `docker compose up -d --build`. Annotations appear within ~15 min of a run upload.
#
# Backups: the loop snapshots the corpus to /data/snapshots before any model-version
# rewrite, and `docker compose exec pacelab pacelab snapshot` writes one by hand. Pulling
# one off the Pi and restoring it are in docs/runbooks/corpus-snapshots.md (ADR-0018).
services:
  pacelab:
    build: .
    env_file: .env
    volumes:
      # A bind mount, not a named volume (ADR-0015): the corpus stays an ordinary file
      # that sqlite3 and scp can reach from the host.
      - ./data:/data
    # The image runs as uid 1000, which is the Pi's first login account. Uncomment and set
    # PUID/PGID in .env if this host's account differs — otherwise the container fails
    # loudly on its first write rather than corrupting anything.
    # user: "${PUID}:${PGID}"
    restart: unless-stopped
